services:
  mindgraph:
    build: .
    ports:
      # Bound to host loopback: the API has NO auth and exposes the whole KB.
      # Change to "0.0.0.0:..." (or drop the prefix) only behind an auth proxy.
      - "127.0.0.1:${MINDGRAPH_REST_PORT:-8401}:8401"
    volumes:
      - ./:/data
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${MINDGRAPH_DB_NAME:-mindgraph}
      POSTGRES_USER: ${MINDGRAPH_DB_USER:-mindgraph}
      POSTGRES_PASSWORD: ${MINDGRAPH_DB_PASSWORD:?set MINDGRAPH_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindgraph"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
