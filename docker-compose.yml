services:
  mindgraph:
    build: .
    ports:
      - "${MINDGRAPH_REST_PORT:-8401}:8401"
    volumes:
      - ./:/data
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${MINDGRAPH_DB_NAME:-mindgraph}
      POSTGRES_USER: ${MINDGRAPH_DB_USER:-mindgraph}
      POSTGRES_PASSWORD: ${MINDGRAPH_DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindgraph"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
